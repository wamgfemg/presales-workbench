name: Deploy to Tencent Cloud

# 关键：本项目【零构建】——不执行 npm install / build。
# 前端是纯静态文件，BFF 是零依赖 Node 脚本，服务器上用 node:22-alpine 容器直接运行。
# 流水线只做「语法自检 → 离线回归断言 → 同步文件 → 一致性复核 → 重启服务 → 健康检查」，
# 服务器全程不参与编译，不存在 OOM 风险。

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'server/**'
      - 'deploy/**'
      - 'test/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync & Restart
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 全量遍历，不再维护硬编码文件清单。
      # 历史事故：新增的 capacity/customer360/funnel/mytodo/reminder 不在名单里，
      # 语法坏掉 CI 也拦不住，导致线上与仓库漂移 3 天无人发现。
      - name: Sanity check (语法自检 · 全量遍历，不安装任何依赖)
        run: |
          set -e
          node --version
          fail=0
          for f in $(find frontend/src server -name '*.js' -not -path '*/node_modules/*' | sort); do
            if node --check "$f" 2>/tmp/synerr; then
              echo "  ok    $f"
            else
              echo "::error file=$f::语法检查未通过"
              cat /tmp/synerr
              fail=1
            fi
          done
          test -f frontend/index.html || { echo "::error::frontend/index.html 缺失"; exit 1; }
          [ "$fail" = "0" ] || exit 1
          echo "语法检查通过（全量 $(find frontend/src server -name '*.js' | wc -l) 个文件）"

      # 离线回归断言：零依赖、不访问网络、不写库。
      # 这些脚本早已存在于 test/ 但从未进过流水线——本步骤把它们接上。
      - name: Regression assertions (离线回归断言)
        run: |
          set -e
          for f in test/p0-assert.cjs test/kb-readonly-assert.cjs test/phase4-assert.cjs test/p1-assert.cjs; do
            echo "########## $f"
            node "$f"
            echo "########## $f 通过"
          done

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync application files
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.SERVER_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            frontend server deploy test \
            "$USER_NAME@$HOST:/opt/presales-workbench/"

      # 线上 /opt/presales-workbench 不是 git 仓库（改生产 = 改唯一副本）。
      # 用与上面完全相同的参数做 dry-run：若仍有差异，说明线上存在未被版本管理的改动。
      - name: Verify production == repository (一致性复核)
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.SERVER_USER }}
        run: |
          set -e
          out=$(rsync -azn --delete --itemize-changes \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            frontend server deploy test \
            "$USER_NAME@$HOST:/opt/presales-workbench/" | grep -v '^$' || true)
          if [ -n "$out" ]; then
            echo "::error::线上与仓库不一致（rsync dry-run 仍有差异）："
            echo "$out"
            exit 1
          fi
          echo "一致性校验通过：线上 == 仓库"

      - name: Restart service and health check
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$USER_NAME@$HOST" bash -s <<'REMOTE'
          set -e
          cp /opt/presales-workbench/deploy/presales-workbench.service /etc/systemd/system/presales-workbench.service
          systemctl daemon-reload
          systemctl restart presales-workbench
          ok=0
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8088/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          echo "----- health -----"
          curl -sS http://127.0.0.1:8088/api/health || true
          echo
          if [ "$ok" != "1" ]; then
            echo "!! 健康检查失败，最近日志："
            journalctl -u presales-workbench -n 40 --no-pager || true
            exit 1
          fi
          echo "----- 资源占用 -----"
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}} {{.CPUPerc}}' presales-workbench || true
          free -h | head -2
          REMOTE

      - name: Summary
        if: always()
        run: echo "访问地址 http://${{ secrets.SERVER_HOST }}:8088" >> $GITHUB_STEP_SUMMARY
